name: Build ImuxCarft Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-glew

      - name: Show repository and texture layout
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          echo "=== Git revision ==="
          git rev-parse HEAD
          echo "=== Texture count ==="
          find assets background -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.bmp' -o -iname '*.tga' \) | wc -l
          echo "=== Texture paths ==="
          find assets background -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.bmp' -o -iname '*.tga' \) | sort || true

      - name: Configure
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release --log-level=VERBOSE 2>&1 | tee configure.log
          grep -E 'SDL2|SDL2_image|GLEW|OPENGL' build/CMakeCache.txt || true

      - name: Build
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cmake --build build --config Release --verbose 2>&1 | tee build.log
          test -f build/ImuxCarft.exe

      - name: Diagnose executable dependencies
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          echo "=== ldd ImuxCarft.exe ==="
          ldd build/ImuxCarft.exe 2>&1 | tee dependencies.log
          if grep -Eiq 'not found|cannot find' dependencies.log; then
            echo "::error::Unresolved DLL dependency before packaging."
            exit 1
          fi

      - name: Package executable, assets and recursive DLL dependencies
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist
          cp build/ImuxCarft.exe dist/
          cp -r build/assets dist/assets
          cp -r build/background dist/background

          copy_deps() {
            local target="$1"
            local dep
            while IFS= read -r dep; do
              [ -f "$dep" ] || continue
              local name="$(basename "$dep")"
              case "$dep" in
                /mingw64/bin/*.dll|/c/msys64/mingw64/bin/*.dll|C:/msys64/mingw64/bin/*.dll)
                  if [ ! -f "dist/$name" ]; then
                    echo "COPY DLL: $dep"
                    cp "$dep" "dist/$name"
                    copy_deps "$dep"
                  fi
                  ;;
              esac
            done < <(
              ldd "$target" 2>/dev/null |
                awk '
                  /=>/ {
                    for (i=1; i<=NF; ++i)
                      if ($i ~ /mingw64\/bin\/.*\.dll$/ || $i ~ /\/mingw64\/bin\/.*\.dll$/) print $i
                  }
                ' |
                sed 's/^[[:space:]]*//; s/[[:space:]]*$//' |
                sort -u
            )
          }

          copy_deps build/ImuxCarft.exe

          # Ensure the common runtime DLLs are present when supplied by MSYS2.
          for dll in \
            SDL2.dll SDL2_image.dll glew32.dll \
            libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll \
            zlib1.dll libpng16-16.dll libjpeg-8.dll libtiff-6.dll libwebp-7.dll; do
            if [ -f "/mingw64/bin/$dll" ] && [ ! -f "dist/$dll" ]; then
              echo "COPY COMMON DLL: /mingw64/bin/$dll"
              cp "/mingw64/bin/$dll" "dist/$dll"
            fi
          done

          echo "=== Packaged files ==="
          find dist -type f -printf '%p %s bytes\n' | sort

          echo "=== DLL files in dist ==="
          find dist -maxdepth 1 -type f -iname '*.dll' -printf '%f\n' | sort

          echo "=== Dependency validation with dist first in PATH ==="
          (
            cd dist
            PATH="$PWD:/mingw64/bin:$PATH" ldd ./ImuxCarft.exe 2>&1 | tee ../packaged-dependencies.log
          )
          if grep -Eiq 'not found|cannot find' packaged-dependencies.log; then
            echo "::error::Packaged executable still has unresolved DLL dependencies."
            exit 1
          fi

          tar -a -c -f ImuxCarft-Windows-x64.zip -C dist .

      - name: Upload build logs and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ImuxCarft-build-logs
          path: |
            configure.log
            build.log
            dependencies.log
            packaged-dependencies.log
          if-no-files-found: error

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ImuxCarft-Windows-x64
          path: |
            dist/ImuxCarft.exe
            dist/assets
            dist/background
            dist/*.dll
            ImuxCarft-Windows-x64.zip
          if-no-files-found: error
